<!DOCTYPE html>
<html>
    <head>
        <title>kiwi.rocks</title>
        <link rel="icon" id="favicon" type="image/x-icon" href="images/favicon.ico">
        <link rel="stylesheet" id="css" href="styles/intro.css">
        <script src="scripts/intro.js" defer></script>
        <meta charset="UTF-8">

        <!-- IMPORTANT: INCLUDE LICENSE WITH ANY EMBEDDED FONTS -->
    </head>
    <body>
        <!-- INTRO SEQUENCE -->
        <!-- students of the craft! try not to put 5 minute cutscenes in your website... -->
        <div id="intro">
            <div id="left">
                <!-- should be 41x41, and need shadows -->
                <div id="guava" class="shadow">
                    <div>
                        <img src="images/guava/guava_sleep.gif" onclick="start()" draggable="false"/>
                    </div>
                </div>
                <img id="sign" src="images/sign.png" draggable="false"/>
                <img id="sign2" src="images/sign2.png" draggable="false"/>
            </div>
            <div id="center" class="container">
                <h2 id="text"></h2>
                <h2 id="indicator"></h2>
                <div id="loading" style="display: none">
                    <h2>loading</h2>
                </div>
            </div>
            <div id="right">
                <img src="images/kiwidesk.gif" draggable="false"/>
                <h2>(Kiwi's desk)</h2>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div id="page">
            <div id="rainbowcontainer">
                <div id="rainbow"></div>
            </div>
            <img id="kiwi" src="images/kiwi/kiwi_1.gif" draggable="false"/>
            <img id="guava2" src="images/guava/guava_0.gif" draggable="false"/>
            <div id="sidebar">
                <h1 id="title">kiwi<br/>&nbsp;.rocks</h1>
                <!-- i seem to have forgotten about the "nav" element -->
                <div id="nav">
                    <h2 id="about" class="navitem">about</h2>
                    <h2 id="projects" class="navitem">projects</h2>
                    <h2 id="skills" class="navitem">skills</h2>
                    <h2 id="resume" class="navitem">resume</h2>
                    <h2 id="contact" class="navitem">contact</h2>
                </div>
                <p id="copyright">(c) 2026 Kiwi. No rights reserved.</p>
            </div>
            <div id="main">
                <div id="arrow">>></div>
                <!-- <div id="arrow2">>></div> -->
                <!-- <img id="hexagon" src="images/hexagon.png" draggable="false"/> -->

                <!-- fun scenes with kiwi & guava! -->
                <div class="scene">
                    <img id="kiwi_guava" src="images/kiwi_guava.gif" draggable="false"/>
                </div>
                <div class="scene">
                    <div id="guava_test" class="shadow">
                        <div>
                            <img src="images/guava/guava_5.gif" draggable="false"/>
                        </div>
                    </div>
                    <div id="kiwi_test" class="shadow">
                        <div>
                            <img src="images/kiwi/kiwi_1.png" draggable="false"/>
                        </div>
                    </div>
                </div>

                <img id="switch" onclick="toggle_mode()" src="images/switch_on.png"/>
            </div>

            <!-- kiwi can walk through her bio and resume -->
            <h2 id="text2" class="text"></h2>
            <h2 id="text3" class="text"></h2>
        </div>
    </body>
</html>
